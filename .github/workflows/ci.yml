name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-tests:
    name: Parser tests (JDK only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run parser-tests.sh
        run: bash parser-tests.sh

  gradle-build:
    name: Gradle unit tests + release AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar
          path: build/outputs/aar/*.aar
